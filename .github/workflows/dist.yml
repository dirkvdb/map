name: Distribution

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure geo-overlay cache (read only)
        uses: cachix/cachix-action@v16
        with:
          name: geo-overlay
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build macOS bundle
        run: devenv shell -- python3 scripts/package_macos.py

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: Map-macOS-${{ runner.arch }}
          path: dist/build/devenv/release/bundle/dmg/Map.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      MISE_DEFAULT_CONFIG_FILENAME: dist/mise.linux.toml
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      MLN_CMAKE_CXX_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/dist/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/dist/vcpkg-cache,readwrite
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang cmake ninja-build libclang-dev pkg-config autoconf automake libtool bison flex imagemagick squashfs-tools libssl-dev libcurl4-openssl-dev zlib1g-dev libuv1-dev libicu-dev libpng-dev libjpeg-dev libwebp-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-sync-dev libwayland-dev libvulkan-dev libglvnd-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: dist/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dist/vcpkg/Cargo.toml', 'dist/vcpkg/triplets/**', 'infra-rs/vcpkg-overlay/ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up mise and packaging tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.4
          cache: false

      - name: Build Linux AppImage
        run: mise exec -- just appimage

      - name: Verify AppImage root permissions
        run: |
          for image in dist/build/release/bundle/appimage/*.AppImage; do
            test -f "$image"
            offset=$("$image" --appimage-offset)
            root=$(unsquashfs -ll -offset "$offset" "$image" | sed -n '1p')
            [[ "$root" == "drwxr-xr-x "*" squashfs-root" ]] || { echo "Invalid AppImage root permissions: $root" >&2; exit 1; }
          done

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        with:
          name: Map-Linux-${{ runner.arch }}
          path: dist/build/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Map-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
