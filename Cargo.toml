[package]
name = "map"
version = "0.1.0"
edition = "2024"
description = "A GPUI desktop raster viewer with a vector basemap"

[package.metadata.bundle]
name = "Map"
identifier = "io.github.dirkvdb.map"
icon = ["dist/icon_512x512.png", "dist/icon_512x512@2x.png"]
category = "Utility"

[dependencies]
anyhow = "1"
async-channel = "2"
bytemuck = { version = "1", features = ["derive"] }
directories = "6"
env_logger = "0.11"
futures-lite = "2"
gdal = "0.19"
geo = { path = "infra-rs/crates/geo", default-features = false, features = ["gdal-static", "deflate"] }
gpui-fps = { version = "0.8", features = ["gpui-fast"] }
gpui-kit = { version = "0.8", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false }
inf = { path = "infra-rs/crates/inf" }
log = "0.4"
maplibre-native-ffi = { git = "https://github.com/maplibre/maplibre-native-ffi", rev = "6718eff7beeb927c6c629b4da617338b0b8fab03" }
maplibre-custom-layer = { path = "crates/maplibre-custom-layer" }
maplibre-raster-compositor = { path = "crates/maplibre-raster-compositor" }
raster-tile = { path = "infra-rs/crates/raster-tile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiler = { path = "infra-rs/crates/tiler" }
url = "2"
wgpu = "29"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
maplibre-native-ffi = { git = "https://github.com/maplibre/maplibre-native-ffi", rev = "6718eff7beeb927c6c629b4da617338b0b8fab03", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
maplibre-native-ffi = { git = "https://github.com/maplibre/maplibre-native-ffi", rev = "6718eff7beeb927c6c629b4da617338b0b8fab03", features = ["metal"] }

[dev-dependencies]
gpui-kit = { version = "0.8", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sqlite = { path = "infra-rs/crates/sqlite" }

# Policy checks must not be bypassed with source-level allow/expect attributes.
[lints.clippy]
cognitive_complexity = "forbid"
too_many_lines = "forbid"
excessive_nesting = "forbid"

[profile.dev]
debug = 0


