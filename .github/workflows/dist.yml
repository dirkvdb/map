name: Distribution

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Nix binary caches (read only)
        uses: cachix/cachix-action@v17
        with:
          name: geo-overlay
          extraPullNames: devenv,cachix
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build macOS bundle
        run: devenv shell -- python3 scripts/package_macos.py

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: Map-macOS-${{ runner.arch }}
          path: dist/build/devenv/release/bundle/dmg/Map.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Nix binary caches (read only)
        uses: cachix/cachix-action@v17
        with:
          name: geo-overlay
          extraPullNames: devenv,cachix
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Build Linux AppImage
        run: devenv shell -- python3 scripts/package_linux.py

      - name: Smoke-test AppImage bootstrap and loader on glibc 2.28
        run: |
          docker pull debian:buster-slim
          docker run --rm --network none \
            --mount "type=bind,source=${{ github.workspace }}/dist/build/devenv/release/bundle/appimage,target=/artifacts,readonly" \
            --workdir /tmp debian:buster-slim sh -eu -c '
              /artifacts/Map-x86_64.AppImage --appimage-extract > /tmp/extract.log 2>&1 || {
                cat /tmp/extract.log
                exit 1
              }
              mode=$(stat -c %a squashfs-root)
              test "$mode" = 755 || {
                echo "Invalid AppImage root permissions: $mode" >&2
                exit 1
              }
              ldd /tmp/squashfs-root/usr/bin/map > /tmp/map-ldd.log 2>&1 || {
                  cat /tmp/map-ldd.log
                  exit 1
                }
              cat /tmp/map-ldd.log
              if grep -E "not found|/nix/store" /tmp/map-ldd.log; then
                echo "AppImage has unresolved or Nix-store loader dependencies" >&2
                exit 1
              fi
            '

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        with:
          name: Map-Linux-${{ runner.arch }}
          path: dist/build/devenv/release/bundle/appimage/Map-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows executable (MinGW)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Nix binary caches (read only)
        uses: cachix/cachix-action@v17
        with:
          name: geo-overlay
          extraPullNames: devenv,cachix
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Test Windows packaging and embedded icon
        run: devenv shell -- env MAP_RUN_NATIVE_TESTS=1 python3 -B -m unittest discover -s scripts/tests -p test_package_windows.py -v

      - name: Build Windows executable
        run: devenv shell -- python3 scripts/package_windows.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: Map-Windows-X64
          path: dist/build/devenv/release/bundle/windows/Map.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Map-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
