[package]
name = "map"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-channel = "2"
env_logger = "0.11"
futures-lite = "2"
gdal = "0.19"
geo = { path = "infra-rs/crates/geo", default-features = false, features = ["gdal-static", "deflate"] }
gpui-kit = { version = "0.7", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false }
inf = { path = "infra-rs/crates/inf" }
log = "0.4"
maplibre_native = { version = "0.10", features = ["wgpu"] }
raster-tile = { path = "infra-rs/crates/raster-tile" }
serde_json = "1"
tiler = { path = "infra-rs/crates/tiler" }
wgpu = "29"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[profile.dev]
debug = 0

# The native C++ bridge treats warnings as errors; Nix's fortify flags need -O.
[profile.dev.package.maplibre_native]
opt-level = 1
