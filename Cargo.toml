[package]
name = "map"
version = "0.1.0"
edition = "2024"
description = "A GPUI desktop raster viewer with a vector basemap"

[package.metadata.bundle]
name = "Map"
identifier = "io.github.dirkvdb.map"
icon = ["dist/icon_512x512.png", "dist/icon_512x512@2x.png"]
category = "Utility"

[dependencies]
anyhow = "1"
async-channel = "2"
bytemuck = { version = "1", features = ["derive"] }
directories = "6"
env_logger = "0.11"
futures-lite = "2"
gdal = "0.19"
geo = { path = "infra-rs/crates/geo", default-features = false, features = ["gdal-static", "deflate"] }
gpui-fps = { version = "0.8", features = ["gpui-fast"] }
gpui-kit = { version = "0.8", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false }
inf = { path = "infra-rs/crates/inf" }
log = "0.4"
maplibre_native = { version = "0.10", features = ["wgpu"] }
raster-tile = { path = "infra-rs/crates/raster-tile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiler = { path = "infra-rs/crates/tiler" }
url = "2"
wgpu = "29"

[patch.crates-io]
maplibre_native = { path = "vendor/maplibre_native" }
webgpu-shim = { path = "vendor/webgpu-shim" }

[dev-dependencies]
gpui-kit = { version = "0.8", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sqlite = { path = "infra-rs/crates/sqlite" }

# Policy checks must not be bypassed with source-level allow/expect attributes.
[lints.clippy]
cognitive_complexity = "forbid"
too_many_lines = "forbid"
excessive_nesting = "forbid"

[profile.dev]
debug = 0

# The native C++ bridge treats warnings as errors; Nix's fortify flags need -O.
[profile.dev.package.maplibre_native]
opt-level = 1
